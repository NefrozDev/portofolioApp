<app-site-header
  [class.app__site-header--hidden]="!appState.siteHeaderVisible()"
  [class.app__navigation--arriving]="appState.arrivedFromHome()"
></app-site-header>
<div class="app__viewport" #viewport>
  <div class="app__page" #page>
    <router-outlet></router-outlet>
  </div>
</div>
@if (appState.siteHeaderVisible()) {
  <app-mobile-bottom-nav
    [class.app__navigation--arriving]="appState.arrivedFromHome()"
  ></app-mobile-bottom-nav>
}
